<app-back-button></app-back-button>

<div class="bulbs-grid">
  @for (light of lights(); track light.id) {
    @let data = light.state;

    <div class="bulb-item" [class.active]="data.power" (click)="goToLight(light.id)">
      <div class="bulb-header">
        <div class="bulb-title-group">
          <div class="bulb-icon" [class.on]="data.power">
            <img src="/assets/icons/zarowka.png" alt="Żarówka" />
          </div>
          <div>
            <h2>{{ light.name }}</h2>
            <span class="status-badge" [class.on]="data.power">
              <span class="status-dot"></span>
              {{ (data.power ? 'zarowka.on' : 'zarowka.off') | transloco }}
            </span>
          </div>
        </div>

        <button
          type="button"
          class="toggle-switch"
          [class.on]="data.power"
          (click)="toggleLight(light.id); $event.stopPropagation()"
          [attr.aria-checked]="data.power"
          role="switch"
        >
          <span class="toggle-knob"></span>
        </button>
      </div>

      <div class="brightness-box" (click)="$event.stopPropagation()">
        <div class="brightness-top">
          <span>{{ 'zarowka.brightness' | transloco }}</span>
          <span class="brightness-val" [class.on]="data.power">{{ data.brightness }}%</span>
        </div>
        <input
          type="range"
          min="1"
          max="100"
          [value]="data.brightness"
          [disabled]="!data.power"
          (input)="onBrightnessChange($event, light.id)"
        />
      </div>
    </div>
  } @empty {
    <h3 class="error-info">{{ 'zarowka.none' | transloco }}</h3>
  }
</div>
