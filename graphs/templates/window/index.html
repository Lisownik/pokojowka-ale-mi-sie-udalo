<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <script src="../../static/sse.js"></script>

  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e4e7ec;
      --text: #1b1f27;
      --muted: #6b7280;
      --accent: #2f6fed;
      --ok: #2e9e6b;
    }



    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
    }

    .page {
      max-width: 1200px;
      padding: 2rem 1rem 3rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.25rem 1rem;
      height: 100%;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin: 0;
    }

    .chart-wrap {
      position: relative;
      height: 260px;
      margin-top: 0.75rem;
    }

    .device-title {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }

    #goBack{
      position: fixed;
      bottom: 30px;
      right: 30px;
    }

  </style>

</head>
<body >
<main class="container page" id="dashboard">

  <header class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div>
      <h1 class="device-title" id="deviceTitle">Okno: {{id}}</h1>
    </div>

  </header>

  <section class="row g-3">
    <div class="col-12 col-lg-6">
      <article class="panel">
        <h2 class="panel-title">Open/Closed</h2>
        <div class="chart-wrap"><canvas id="chart-open"></canvas></div>
      </article>
    </div>

  </section>
</main>
<button id="goBack" class="btn btn-primary">Go Back</button>


  <script>

    let host = "{{host}}";

    const windowsObservable = createEventSource("windows", host);

    function createChart(id, label, color){
      return new Chart(document.getElementById(id), {
        type: 'line',
        data: {
          datasets: [{
            label,
            data: [],
            borderColor: color,
            tension: 0.2
          }]
        },
        options: {
          animation: false,
          parsing: false,
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'second',
                tooltipFormat: 'HH:mm:ss',
                displayFormats: {
                  second: 'HH:mm:ss',
                  minute: 'HH:mm',
                  hour: 'HH:mm'
                }
              },
              title: { display: true, text: 'Time' }
            },
            y: { title: { display: true, text: label } }
          }
        }
      });
    }

    const openChart = createChart("chart-open", "Otwarte", "green");

    const MAX_LENGTH = 20;

    function updateChart(chart, newValue){
      const dataset = chart.data.datasets[0].data;
      dataset.push({ x: Date.now(), y: newValue })
      if(dataset.length > MAX_LENGTH)
        dataset.shift()

      console.log(dataset, newValue);
      chart.data.datasets[0].data = dataset;
      chart.update();
    }

    const id = '{{ id }}';
    windowsObservable.subscribe((rooms) => {
      const room = rooms.find((room) => room.id === id);
      if(!room)
        return;

      console.log(room)

      updateChart(openChart, Number(room.state.open));


    });

    document.getElementById('goBack').addEventListener('click', () => {
      document.location.href = "/";
    })


  </script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
