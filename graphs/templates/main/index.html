<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <script src="../../static/sse.js"></script>

  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e4e7ec;
      --text: #1b1f27;
      --muted: #6b7280;
      --accent: #2f6fed;
      --ok: #2e9e6b;
    }



    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
    }

    .page {
      max-width: 1200px;
      padding: 2rem 1rem 3rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.25rem 1rem;
      height: 100%;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin: 0;
    }

    .chart-wrap {
      position: relative;
      height: 260px;
      margin-top: 0.75rem;
    }

    .device-title {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }

  </style>

</head>
<body >
<main class="container page" id="dashboard">
  <h1>Pokojówki</h1>
  <div id="rooms" class="row">
  </div>

  <h1>Smart LEDziki</h1>
  <div id="bulbs" class="row">
  </div>

  <h1>Heatery</h1>
  <div id="heaters" class="row">
  </div>

  <h1>Okna</h1>
  <div id="windows" class="row">
  </div>
</main>

  <script>

    let host = "{{host}}";

    const roomsObservable = createEventSource("rooms", host);
    const bulbsObservable = createEventSource("bulbs", host);
    const heatersObservable = createEventSource("heaters", host);
    const windowsObservable = createEventSource("windows", host);

    function generateHTMLCard(id, type, name){
      const div = document.createElement("div")
      div.className = "card"

      const cardBody = document.createElement("div")
      cardBody.className = "card-body"

      const title = document.createElement("h5")
      title.className = "card-title"
      title.innerText = `${name}`
      cardBody.appendChild(title)

      const cardText = document.createElement("p")
      cardText.className = "card-text"
      cardText.innerText = `ID: ${id} and of type ${type}`
      cardBody.appendChild(cardText)

      const button = document.createElement("a")
      button.className = "btn btn-primary"
      button.href = `/${type}/${id}`
      button.innerText = "View Device"
      cardBody.appendChild(button)

      div.appendChild(cardBody)
      return div;
    }


    const roomsRow = document.getElementById("rooms")
    const bulbsRow = document.getElementById("bulbs")
    const heatersRow = document.getElementById("heaters")
    const windowsRow = document.getElementById("windows")

    function createCards(cardsRow, cardData, name){
      while (cardsRow.firstChild) {
        cardsRow.removeChild(cardsRow.lastChild);
      }


        cardData.forEach((data) => {
          console.log(data.id)
          cardsRow.appendChild(
            generateHTMLCard(
              data.id,
              data.type,
              data.name
            )
          )
        })

    }

    roomsObservable.subscribe((rooms) => {
      createCards(roomsRow, rooms, "Pokojówka")
    })

    bulbsObservable.subscribe((bulbs) => {
      createCards(bulbsRow, bulbs, "Smart LEDzik")
    })

    heatersObservable.subscribe((heaters) => {
      createCards(heatersRow, heaters, "Hitler")
    })

    windowsObservable.subscribe((windows) => {
      createCards(windowsRow, windows, "Okno")
    })

  </script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
