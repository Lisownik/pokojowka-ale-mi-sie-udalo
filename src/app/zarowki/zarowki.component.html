<app-back-button></app-back-button>
<app-action-button></app-action-button>

<div class="lights-grid">
  @for (light of lights; track light.id) {
    <div class="light-container" (click)="goToLight(light.id)">
      <div class="light-header">
        <h2>{{ light.name }}</h2>
        <div class="light-status-indicator">
          <div class="status-dot" [ngClass]="{'status-on': light.isOn, 'status-off': !light.isOn}"></div>
          <span>{{ light.isOn ? 'Włączona' : 'Wyłączona' }}</span>
        </div>
      </div>

      <div class="light-content">
        <div class="light-image">
          <img src="/assets/icons/zarowka-2.png" alt="Żarówka" [ngClass]="{'light-on': light.isOn, 'light-off': !light.isOn}"/>
        </div>

        <div class="light-controls">
          <div class="toggle-container">
            <span class="toggle-label">Włącznik</span>
            <div class="toggle-button" [ngClass]="{'toggle-on': light.isOn}" (click)="toggleLight(light.id); $event.stopPropagation()">
              <div class="toggle-slider"></div>
            </div>
          </div>

          <div class="slider-container">
            <div class="slider-header">
              <label>Jasność</label>
              <span class="slider-value">{{ light.brightness }}%</span>
            </div>
            <input type="range" min="1" max="100" [value]="light.brightness"
                   (input)="onBrightnessChange($event, light.id)" [disabled]="!light.isOn"
                   (click)="$event.stopPropagation()">
          </div>
        </div>
      </div>
    </div>
  }
</div>
